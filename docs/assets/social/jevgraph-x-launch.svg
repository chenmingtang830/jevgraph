<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="x-hero-title x-hero-desc">
  <title id="x-hero-title">JevGraph — a faster, cheaper path from documents to graphs</title>
  <desc id="x-hero-desc">Launch image for the open-source JevGraph project. Documents flow into an evidence-backed candidate graph. Benchmark highlights show a 0.43 second response, about 0.41 cents per 100 decisions, and 87.5 percent accuracy.</desc>
  <rect width="1200" height="675" fill="#f7f6f2"/>

  <g transform="translate(68 56)">
    <rect x="0" y="0" width="26" height="34" fill="none" stroke="#171a20" stroke-width="3"/>
    <circle cx="26" cy="34" r="6" fill="#0e6675"/>
    <text x="44" y="27" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="750">JevGraph</text>
  </g>
  <text x="1132" y="82" text-anchor="end" fill="#69717c" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="650">OPEN SOURCE</text>

  <g fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="780" letter-spacing="-2">
    <text x="68" y="174">A faster, cheaper path</text>
    <text x="68" y="234">from documents</text>
    <text x="68" y="294">to <tspan fill="#0e6675">candidate graphs.</tspan></text>
  </g>
  <g fill="#4f5662" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="500">
    <text x="68" y="384">Every proposed relationship stays linked</text>
    <text x="68" y="414">to the evidence behind it.</text>
  </g>

