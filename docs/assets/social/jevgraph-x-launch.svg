<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="x-launch-title x-launch-desc">
  <title id="x-launch-title">Introducing JevGraph</title>
  <desc id="x-launch-desc">Open-source JevGraph turns documents into evidence-backed candidate graphs. A four-step flow leads from documents through local blocking and a bounded Jev relation choice to a candidate graph. Benchmark callouts show 431 milliseconds p95 latency, 0.410 cents illustrative cost per 100 planned decisions, and 87.5 percent planned-case accuracy.</desc>
  <defs>
    <marker id="x-launch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#69717c"/></marker>
    <marker id="x-launch-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0e6675"/></marker>
  </defs>

  <rect width="1200" height="675" fill="#f7f6f2"/>
  <rect x="0" y="0" width="16" height="675" fill="#0e6675"/>

  <text x="72" y="72" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3">OPEN SOURCE · EVIDENCE FIRST</text>
  <text x="72" y="156" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="67" font-weight="750" letter-spacing="-3">introducing <tspan fill="#0e6675">JevGraph</tspan></text>
  <text x="72" y="207" fill="#4f5662" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="600">Documents → evidence-backed candidate graphs</text>
  <line x1="72" y1="238" x2="1128" y2="238" stroke="#171a20" stroke-width="2"/>

  <path d="M276 344H324" fill="none" stroke="#69717c" stroke-width="3" marker-end="url(#x-launch-arrow)"/>
  <path d="M528 344H576" fill="none" stroke="#0e6675" stroke-width="4" marker-end="url(#x-launch-arrow-accent)"/>
  <path d="M780 344H828" fill="none" stroke="#0e6675" stroke-width="4" marker-end="url(#x-launch-arrow-accent)"/>

  <rect x="72" y="280" width="204" height="128" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <text x="96" y="326" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">Documents</text>
  <text x="96" y="368" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">PDF · DOCX · PPTX</text>

  <rect x="324" y="280" width="204" height="128" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <text x="348" y="326" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">Block locally</text>
  <text x="348" y="368" fill="#0e6675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">O(n²) → O(nk)</text>

  <rect x="576" y="280" width="204" height="128" fill="#0e6675" stroke="#0e6675" stroke-width="2"/>
  <text x="600" y="318" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">JEV</text>
  <text x="600" y="358" fill="#ffffff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">Choose relation</text>
  <text x="600" y="386" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">one retained pair</text>

  <rect x="828" y="280" width="300" height="128" fill="#edf6f6" stroke="#0e6675" stroke-width="2"/>
  <text x="852" y="326" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">Candidate graph</text>
  <line x1="1016" y1="358" x2="1052" y2="336" stroke="#0e6675" stroke-width="3"/>
  <line x1="1016" y1="358" x2="1052" y2="380" stroke="#0e6675" stroke-width="3"/>
  <line x1="1016" y1="358" x2="980" y2="380" stroke="#0e6675" stroke-width="3"/>
  <circle cx="1016" cy="358" r="20" fill="#0e6675"/>
  <circle cx="1060" cy="332" r="11" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <circle cx="1060" cy="384" r="11" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <circle cx="972" cy="384" r="11" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <text x="852" y="382" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">evidence attached</text>

  <line x1="72" y1="456" x2="1128" y2="456" stroke="#d6dbd8" stroke-width="2"/>
  <text x="72" y="488" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">CONTROLLED 160-CASE BENCHMARK</text>

  <text x="72" y="554" fill="#0e6675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="45" font-weight="750">431 ms</text>
  <text x="72" y="584" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">p95 latency</text>

  <line x1="396" y1="500" x2="396" y2="608" stroke="#d6dbd8" stroke-width="2"/>
  <text x="436" y="554" fill="#0e6675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="45" font-weight="750">0.410¢</text>
  <text x="436" y="584" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">per 100 decisions*</text>

  <line x1="780" y1="500" x2="780" y2="608" stroke="#d6dbd8" stroke-width="2"/>
  <text x="820" y="554" fill="#171a20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="45" font-weight="750">87.5%</text>
  <text x="820" y="584" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">planned-case accuracy</text>

  <text x="72" y="638" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">* illustrative input list-price equivalent · candidate decisions are not graph truth</text>
</svg>
