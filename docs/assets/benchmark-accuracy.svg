<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="accuracy-title accuracy-desc">
  <title id="accuracy-title">JevGraph benchmark planned-case accuracy</title>
  <desc id="accuracy-desc">Horizontal bar chart starting at zero. Jev achieved 87.500 percent planned-case accuracy, GPT-5.6 Luna 89.375 percent, and DeepSeek V4.1 Flash 93.125 percent. Higher is better.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="64" y="70" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">JEVGRAPH · 160 MATCHED CASES</text>
  <text x="64" y="137" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Planned-case accuracy</text>
  <text x="1136" y="131" fill="#0e6675" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="end">HIGHER IS BETTER</text>
  <line x1="64" y1="166" x2="1136" y2="166" stroke="#171a20" stroke-width="2"/>

  <g stroke="#d6dbd8" stroke-width="1">
    <line x1="280" y1="194" x2="280" y2="516" stroke="#171a20" stroke-width="2"/>
    <line x1="480" y1="194" x2="480" y2="516"/>
    <line x1="680" y1="194" x2="680" y2="516"/>
    <line x1="880" y1="194" x2="880" y2="516"/>
    <line x1="1080" y1="194" x2="1080" y2="516"/>
  </g>
  <g fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">
    <text x="280" y="548">0%</text><text x="480" y="548">25%</text><text x="680" y="548">50%</text><text x="880" y="548">75%</text><text x="1080" y="548">100%</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="end" fill="#171a20">
    <text x="250" y="264">Jev</text><text x="250" y="384">GPT-5.6 Luna</text><text x="250" y="504">DeepSeek V4.1</text>
  </g>
  <rect x="280" y="218" width="700" height="64" fill="#0e6675"/>
  <rect x="280" y="338" width="715" height="64" fill="#d6dbd8" stroke="#69717c" stroke-width="2"/>
  <rect x="280" y="458" width="745" height="64" fill="#d6dbd8" stroke="#69717c" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" text-anchor="end">
    <text x="1176" y="260" fill="#0e6675">87.500%</text>
    <text x="1176" y="380" fill="#4f5662">89.375%</text>
    <text x="1176" y="500" fill="#4f5662">93.125%</text>
  </g>
  <text x="64" y="600" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">The speed and cost advantage comes with a visible accuracy tradeoff</text>
</svg>
