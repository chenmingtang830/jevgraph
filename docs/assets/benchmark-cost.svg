<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="cost-title cost-desc">
  <title id="cost-title">JevGraph benchmark cost per 100 planned decisions</title>
  <desc id="cost-desc">Horizontal bar chart starting at zero. Jev cost 0.410 cents as an illustrative list-price equivalent, GPT-5.6 Luna cost 1.225 cents by provider receipt, and DeepSeek V4.1 Flash cost 1.462 cents by provider receipt. Lower is better.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="64" y="70" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">JEVGRAPH · 100 PLANNED DECISIONS</text>
  <text x="64" y="137" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Cost</text>
  <text x="1136" y="131" fill="#0e6675" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="end">LOWER IS BETTER</text>
  <line x1="64" y1="166" x2="1136" y2="166" stroke="#171a20" stroke-width="2"/>

  <g stroke="#d6dbd8" stroke-width="1">
    <line x1="280" y1="194" x2="280" y2="516" stroke="#171a20" stroke-width="2"/>
    <line x1="547" y1="194" x2="547" y2="516"/>
    <line x1="813" y1="194" x2="813" y2="516"/>
    <line x1="1080" y1="194" x2="1080" y2="516"/>
  </g>
  <g fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">
    <text x="280" y="548">0</text><text x="547" y="548">0.5¢</text><text x="813" y="548">1.0¢</text><text x="1080" y="548">1.5¢</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="end" fill="#171a20">
    <text x="250" y="250" font-size="24" font-weight="700">Jev</text><text x="250" y="274" fill="#69717c" font-size="16" font-weight="600">ILLUSTRATIVE</text>
    <text x="250" y="370" font-size="24" font-weight="700">GPT-5.6 Luna</text><text x="250" y="394" fill="#69717c" font-size="16" font-weight="600">RECEIPT</text>
    <text x="250" y="490" font-size="24" font-weight="700">DeepSeek V4.1</text><text x="250" y="514" fill="#69717c" font-size="16" font-weight="600">RECEIPT</text>
  </g>
  <rect x="280" y="218" width="219" height="64" fill="#0e6675"/>
  <rect x="280" y="338" width="653" height="64" fill="#d6dbd8" stroke="#69717c" stroke-width="2"/>
  <rect x="280" y="458" width="780" height="64" fill="#d6dbd8" stroke="#69717c" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" text-anchor="end">
    <text x="1176" y="260" fill="#0e6675">0.410¢</text>
    <text x="1176" y="380" fill="#4f5662">1.225¢</text>
    <text x="1176" y="500" fill="#4f5662">1.462¢</text>
  </g>
  <text x="64" y="600" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">Jev ≈3.0× below Luna · 3.6× below DeepSeek</text>
</svg>
