<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="latency-title latency-desc">
  <title id="latency-title">JevGraph benchmark p95 latency</title>
  <desc id="latency-desc">Horizontal bar chart starting at zero. Jev measured 431 milliseconds, GPT-5.6 Luna 1,699 milliseconds, and DeepSeek V4.1 Flash 1,242 milliseconds. Lower is better.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="64" y="70" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">JEVGRAPH · 160 MATCHED CASES</text>
  <text x="64" y="137" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">p95 latency</text>
  <text x="1136" y="131" fill="#0e6675" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="end">LOWER IS BETTER</text>
  <line x1="64" y1="166" x2="1136" y2="166" stroke="#171a20" stroke-width="2"/>

  <g stroke="#d6dbd8" stroke-width="1">
    <line x1="280" y1="194" x2="280" y2="516" stroke="#171a20" stroke-width="2"/>
    <line x1="547" y1="194" x2="547" y2="516"/>
    <line x1="813" y1="194" x2="813" y2="516"/>
    <line x1="1080" y1="194" x2="1080" y2="516"/>
  </g>
  <g fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">
    <text x="280" y="548">0</text><text x="547" y="548">600</text><text x="813" y="548">1,200</text><text x="1080" y="548">1,800 ms</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="end" fill="#171a20">
    <text x="250" y="264">Jev</text><text x="250" y="384">GPT-5.6 Luna</text><text x="250" y="504">DeepSeek V4.1</text>
  </g>
  <rect x="280" y="218" width="192" height="64" fill="#0e6675"/>
  <rect x="280" y="338" width="755" height="64" fill="#d6dbd8" stroke="#69717c" stroke-width="2"/>
  <rect x="280" y="458" width="552" height="64" fill="#d6dbd8" stroke="#69717c" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" text-anchor="end">
    <text x="1176" y="260" fill="#0e6675">431 ms</text>
    <text x="1176" y="380" fill="#4f5662">1,699 ms</text>
    <text x="1176" y="500" fill="#4f5662">1,242 ms</text>
  </g>
  <text x="64" y="600" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">Jev was 3.94× below Luna · 2.88× below DeepSeek</text>
</svg>
