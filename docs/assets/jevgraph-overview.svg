<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="jevgraph-overview-title jevgraph-overview-desc">
  <title id="jevgraph-overview-title">JevGraph overview</title>
  <desc id="jevgraph-overview-desc">Documents are parsed and blocked locally, Jev chooses a relation for each retained pair, an evidence gate validates the result, and JevGraph emits an evidence-backed candidate graph.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#69717c"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0e6675"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="64" y="76" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">OPEN SOURCE · EVIDENCE FIRST</text>
  <text x="64" y="142" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Documents become a</text>
  <text x="565" y="142" fill="#0e6675" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">candidate graph</text>
  <line x1="64" y1="174" x2="1136" y2="174" stroke="#171a20" stroke-width="2"/>

  <path d="M256 322H288" fill="none" stroke="#69717c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M504 322H536" fill="none" stroke="#0e6675" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <path d="M752 322H784" fill="none" stroke="#0e6675" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <path d="M1000 322H1032" fill="none" stroke="#69717c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="230" width="192" height="184" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <text x="88" y="278" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">Documents</text>
  <text x="88" y="322" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">PDF · DOCX</text>
  <text x="88" y="352" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">PPTX · text</text>

  <rect x="288" y="230" width="216" height="184" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <text x="312" y="278" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">Parse + block</text>
  <text x="312" y="322" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">local evidence</text>
  <text x="312" y="352" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">bounded pairs</text>
  <text x="312" y="390" fill="#0e6675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">O(n²) → O(nk)</text>

  <rect x="536" y="230" width="216" height="184" fill="#0e6675" stroke="#0e6675" stroke-width="2"/>
  <text x="560" y="270" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">JEV</text>
  <text x="560" y="318" fill="#ffffff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Choose one</text>
  <text x="560" y="352" fill="#ffffff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">relation</text>
  <text x="560" y="390" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">per retained pair</text>

  <rect x="784" y="230" width="216" height="184" fill="#edf6f6" stroke="#0e6675" stroke-width="2"/>
  <text x="808" y="278" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">Evidence gate</text>
  <text x="808" y="326" fill="#0e6675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="700">4</text>
  <text x="858" y="326" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">proposed</text>
  <text x="808" y="362" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">11 rejected</text>
  <text x="808" y="390" fill="#4f5662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">0 review</text>

  <rect x="1032" y="230" width="104" height="184" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <line x1="1084" y1="322" x2="1058" y2="282" stroke="#0e6675" stroke-width="3"/>
  <line x1="1084" y1="322" x2="1110" y2="282" stroke="#0e6675" stroke-width="3"/>
  <line x1="1084" y1="322" x2="1058" y2="362" stroke="#0e6675" stroke-width="3"/>
  <line x1="1084" y1="322" x2="1110" y2="362" stroke="#0e6675" stroke-width="3"/>
  <circle cx="1084" cy="322" r="24" fill="#0e6675"/>
  <circle cx="1058" cy="282" r="12" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <circle cx="1110" cy="282" r="12" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <circle cx="1058" cy="362" r="12" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <circle cx="1110" cy="362" r="12" fill="#ffffff" stroke="#171a20" stroke-width="2"/>
  <text x="1084" y="397" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">GRAPH</text>

  <line x1="64" y1="476" x2="1136" y2="476" stroke="#d6dbd8" stroke-width="2"/>
  <text x="64" y="526" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">2.9–3.9× lower p95 latency</text>
  <text x="64" y="558" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">controlled 160-case relation-selection benchmark</text>
  <text x="1136" y="526" fill="#171a20" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="end">Evidence stays attached</text>
  <text x="1136" y="558" fill="#69717c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="end">candidate decisions are not graph truth</text>
</svg>
