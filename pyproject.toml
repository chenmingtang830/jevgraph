[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jevgraph"
version = "0.5.1"
description = "Schema-guided document-to-graph construction with typed relation decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Richard Tang" }]
keywords = ["knowledge-graph", "relation-extraction", "jev", "information-extraction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
documents = [
  "docjev @ git+https://github.com/jerryjliu/docjev.git@9ed0fe05984ce1906af9272b8b400c8d46520f98",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "reportlab>=4,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
jevgraph = "jevgraph.cli:main"

[project.urls]
Homepage = "https://github.com/chenmingtang830/jevgraph"
Repository = "https://github.com/chenmingtang830/jevgraph"
Issues = "https://github.com/chenmingtang830/jevgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jevgraph"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
